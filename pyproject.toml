[project]
name = "langchain-single-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "agnihotri1989", email = "agnihotri.kshitiz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[project.scripts]
langchain-single-agent = "langchain_single_agent:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
